name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: winmac.exe
            toolchain: stable-x86_64-pc-windows-gnu
          - os: macos-latest
            bin: winmac
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo +${{ matrix.toolchain }} build --release
      - uses: actions/upload-artifact@v4
        with:
          name: winmac-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}
