[package]
name = "winmac"
version = "0.1.0"
edition = "2021"
description = "Kongsi satu mouse/keyboard dan clipboard antara Windows dan macOS melalui LAN"
license = "MIT"

[dependencies]
rdev = { version = "0.5.3", features = ["serialize", "unstable_grab"] }
arboard = { version = "=3.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }

[profile.release]
opt-level = 3

# Nota: arboard dikunci pada 3.6.1 dan clap tidak digunakan supaya tiada kebergantungan
# pada windows-sys 0.61 (raw-dylib), yang memerlukan dlltool.exe semasa build dengan
# toolchain GNU di Windows.
