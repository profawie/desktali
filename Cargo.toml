[package]
name = "winmac"
version = "0.2.0"
edition = "2021"
description = "Share one mouse/keyboard and the clipboard between Windows and macOS over LAN"
license = "MIT"

[dependencies]
rdev = { version = "0.5.3", features = ["serialize", "unstable_grab"] }
arboard = { version = "=3.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "=0.21.0", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wincon", "consoleapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[profile.release]
opt-level = 3

# Note: arboard and tray-icon are pinned and clap is not used, so that nothing pulls in
# windows-sys 0.61 / windows-link (raw-dylib). Those need dlltool.exe when building
# with the GNU toolchain on Windows. CI checks the Windows build without MinGW on PATH.
